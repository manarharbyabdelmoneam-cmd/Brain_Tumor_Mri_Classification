# ============================================================
# docker-compose.yml
# تشغيل تطبيق Brain Tumor MRI Classifier باستخدام Docker Compose
# ============================================================

version: '3.8'

# ============================================================
# 1. الخدمات
# ============================================================

services:
  # ============================================================
  # 1.1. تطبيق Streamlit
  # ============================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brain-tumor-app
    restart: unless-stopped
    ports:
      - "8501:8501"
    
    # ============================================================
    # 1.2. مجلدات متصلة (Volumes)
    # ============================================================
    volumes:
      # بيانات التطبيق
      - ./data:/app/data
      
      # النماذج المدربة
      - ./models_saved:/app/models_saved
      
      # السجلات
      - ./logs:/app/logs
      
      # الصور المرفوعة
      - ./uploads:/app/uploads
      
      # التقارير
      - ./reports:/app/reports
      
      # ملفات التكوين (اختياري)
      - ./.env:/app/.env:ro
      - ./config.yaml:/app/config.yaml:ro
    
    # ============================================================
    # 1.3. متغيرات البيئة
    # ============================================================
    environment:
      # البيئة
      APP_ENVIRONMENT: production
      APP_DEBUG: "false"
      
      # مسارات النماذج
      MODEL_PATH: /app/models_saved/keras_model.h5
      CLASS_NAMES_PATH: /app/models_saved/metadata/class_names.json
      
      # إعدادات التطبيق
      STREAMLIT_SERVER_PORT: 8501
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      STREAMLIT_RUNNER_MAGIC_ENABLED: "false"
      
      # إعدادات التحميل
      MAX_UPLOAD_SIZE_MB: 10
      ALLOWED_EXTENSIONS: "jpg,jpeg,png"
      
      # إعدادات الأداء
      ENABLE_CACHE: "true"
      ENABLE_GRADCAM: "true"
      ENABLE_PREDICTION_LOG: "true"
    
    # ============================================================
    # 1.4. متغيرات البيئة من ملف (اختياري)
    # ============================================================
    # env_file:
    #   - .env
    
    # ============================================================
    # 1.5. الأوامر والتحقق من الصحة
    # ============================================================
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    networks:
      - brain-tumor-network
    
    # ============================================================
    # 1.6. حدود الموارد (اختياري)
    # ============================================================
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2'
    #       memory: 4G
    #     reservations:
    #       cpus: '0.5'
    #       memory: 1G

  # ============================================================
  # 2. خدمة قاعدة البيانات (PostgreSQL) - اختياري
  # ============================================================
  # database:
  #   image: postgres:15-alpine
  #   container_name: brain-tumor-db
  #   restart: unless-stopped
  #   environment:
