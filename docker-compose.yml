  #   volumes:
  #     - ./database/postgres_data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #   networks:
  #     - brain-tumor-network

  # ============================================================
  # 3. خدمة Redis (ذاكرة تخزين مؤقت) - اختياري
  # ============================================================
  # redis:
  #   image: redis:7-alpine
  #   container_name: brain-tumor-redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - ./database/redis_data:/data
  #   networks:
  #     - brain-tumor-network

  # ============================================================
  # 4. خدمة Nginx (موازن الأحمال) - اختياري
  # ============================================================
  # nginx:
  #   image: nginx:alpine
  #   container_name: brain-tumor-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./nginx/ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - app
  #   networks:
  #     - brain-tumor-network

# ============================================================
# 5. الشبكات
# ============================================================

networks:
  brain-tumor-network:
    driver: bridge
    name: brain-tumor-network

# ============================================================
# 6. المجلدات المشتركة (Volumes)
# ============================================================

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
